<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPM APA &mdash; Events</title>
<!--
============================================================================
EventViewer — public events calendar for South Portland Metro APA
============================================================================
PURPOSE
  Player-facing view of the league calendar. Reads the PUBLIC /snapshot
  endpoint on the Event Horizon Worker (no key, no Google auth in the
  browser) and RE-CONSOLIDATES the exploded Google Calendar events back
  into the poolplayers shape: one card per poolplayers entry, sub-events
  nested underneath.

  This REPLACES the retired EventHorizon admin dashboard that used to live
  at this URL (it drove a Google Apps Script backend that now 404s). Admin
  now lives in the Slate "Event Horizon" tab. Old file is in git history.

DESIGN (decided with the operator 2026-07-18)
  • Layout B — group header + tight child rows; nothing hidden except prose.
  • Descriptive text (division lists, table fees, eligibility) sits behind a
    "Details" toggle so the triannuals' ~13 lines don't swamp the page.
  • Group-level filter chips (Sessions / Qualifiers / Tournaments / Holidays)
    plus area chips. Columbia River defaults OFF — a neighbouring area's
    events are useful to some players, noise to most.
  • Mobile first: players read this on a phone, in a bar.

DATA FLOW
  poolplayers (source of truth) → Worker sync → Google Calendar → /snapshot
  → this page. Holidays are the ONE thing not originating in poolplayers.

LIVE DATA
  Re-fetches every 5 min and whenever the tab regains focus. The render is
  idempotent — expanded cards, chip state and scroll position survive it.
============================================================================
-->
<link rel="stylesheet" href="https://southportlandmetroapa.github.io/shared/spm-base.css">
<style>
  :root { --ev-line:#e6e6e6; --ev-muted:#6b7280; --ev-accent:#0b4ea2; }
  body { margin:0; background:#fafafa; }
  .ev-wrap { max-width:760px; margin:0 auto; padding:14px 12px 56px; }
  .ev-head h1 { margin:0 0 2px; font-size:1.35rem; }
  .ev-sub { color:var(--ev-muted); font-size:0.82rem; margin:0 0 12px; }

  .ev-chips { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 6px; }
  .ev-chip {
    border:1px solid #cfd4dc; background:#fff; color:#374151;
    border-radius:999px; padding:5px 11px; font-size:0.8rem; font-weight:600;
    cursor:pointer; line-height:1.2;
  }
  .ev-chip[aria-pressed="true"] { background:var(--ev-accent); border-color:var(--ev-accent); color:#fff; }
  .ev-chip:focus-visible { outline:3px solid #ffbf47; outline-offset:2px; }
  .ev-chips-label { font-size:0.7rem; text-transform:uppercase; letter-spacing:.06em;
                    color:var(--ev-muted); font-weight:700; margin:10px 0 4px; }

  .ev-month { font-size:0.74rem; text-transform:uppercase; letter-spacing:.08em;
              color:var(--ev-muted); font-weight:700; margin:18px 0 6px;
              border-bottom:1px solid var(--ev-line); padding-bottom:4px; }

  .ev-card { background:#fff; border:1px solid var(--ev-line); border-radius:10px;
             padding:11px 13px; margin-bottom:8px; }
  .ev-card.is-holiday { background:#fbfbfd; border-style:dashed; }
  .ev-title { font-weight:700; font-size:0.98rem; margin:0 0 2px; }
  .ev-meta { color:var(--ev-muted); font-size:0.8rem; }
  .ev-badge { display:inline-block; font-size:0.66rem; font-weight:700; text-transform:uppercase;
              letter-spacing:.04em; padding:2px 7px; border-radius:999px; margin-left:6px;
              background:#eef2f7; color:#334155; vertical-align:1px; }
  .ev-kids { margin:8px 0 0; padding:8px 0 0; border-top:1px dashed var(--ev-line); }
  .ev-kid { display:flex; gap:10px; padding:3px 0; font-size:0.88rem; }
  .ev-kid-name { flex:1; }
  .ev-kid-when { color:var(--ev-muted); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .ev-more { background:none; border:none; color:var(--ev-accent); font-size:0.78rem;
             font-weight:700; padding:6px 0 0; cursor:pointer; }
  .ev-more:focus-visible { outline:3px solid #ffbf47; outline-offset:2px; }
  .ev-details { margin:6px 0 0; padding:8px 10px; background:#f6f8fa; border-radius:8px;
                font-size:0.83rem; white-space:pre-wrap; color:#374151; }
  .ev-empty, .ev-err { padding:22px 4px; color:var(--ev-muted); }
  .ev-err { color:#b42318; }
  @media (max-width:430px) {
    .ev-kid { flex-direction:column; gap:0; }
    .ev-kid-when { white-space:normal; }
  }
</style>
</head>
<body>
<div class="ev-wrap">
  <div class="ev-head">
    <h1>South Portland Metro APA</h1>
    <p class="ev-sub" id="evSub">Loading events&hellip;</p>
  </div>

  <div class="ev-chips-label">Show</div>
  <div class="ev-chips" id="evTypeChips"></div>
  <div class="ev-chips-label">Area</div>
  <div class="ev-chips" id="evAreaChips"></div>

  <div id="evList"><div class="ev-empty">Loading&hellip;</div></div>
</div>

<script>
/* Public snapshot — no key. The Worker does all the Google work server-side. */
var SNAPSHOT_URL = 'https://eventhorizon.spmapa.workers.dev/snapshot';
var REFRESH_MS = 5 * 60 * 1000;

/* type → filter group. Keep in step with slate.eventhorizon_types.grp. */
function groupOf(type) {
  if (!type) return 'other';
  if (type.indexOf('session-') === 0) return 'sessions';
  if (type === 'qualifier') return 'qualifiers';
  if (type.indexOf('tournament-') === 0) return 'tournaments';
  if (type === 'holiday') return 'holidays';
  return 'other';
}
var TYPE_GROUPS = [
  { key:'sessions',    label:'Sessions' },
  { key:'qualifiers',  label:'Qualifiers' },
  { key:'tournaments', label:'Tournaments' },
  { key:'holidays',    label:'Holidays' }
];
var AREAS = [
  { key:'spm',            label:'South Portland Metro' },
  { key:'national',       label:'National' },
  { key:'columbia-river', label:'Columbia River' },
  { key:'general',        label:'General' }
];
/* Columbia River starts OFF by design — see the header note. */
var state = {
  groups: [],
  types: { sessions:true, qualifiers:true, tournaments:true, holidays:true, other:true },
  areas: { spm:true, national:true, 'columbia-river':false, general:true },
  open: {},                 /* parentId → details expanded; survives re-render */
  ranAt: null, error: null
};

function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

function fmtDay(iso) {
  if (!iso) return '';
  var d = new Date(iso.length <= 10 ? iso + 'T12:00:00' : iso);
  if (isNaN(d)) return String(iso);
  return d.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
}
function fmtTime(iso) {
  if (!iso || iso.length <= 10) return '';
  var d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
}
/* "Aug 4, 4:00 PM – Aug 9, 2:00 PM", collapsing same-day and all-day forms. */
function fmtRange(start, end, allDay) {
  if (allDay || (start && start.length <= 10)) return fmtDay(start) + ' — all day';
  var sd = fmtDay(start), st = fmtTime(start), ed = fmtDay(end), et = fmtTime(end);
  if (!end) return sd + (st ? ', ' + st : '');
  if (sd === ed) return sd + ', ' + st + ' – ' + et;
  return sd + ', ' + st + ' – ' + ed + ', ' + et;
}
function monthKey(iso) {
  var d = new Date(iso.length <= 10 ? iso + 'T12:00:00' : iso);
  return isNaN(d) ? '' : d.toLocaleDateString(undefined, { month:'long', year:'numeric' });
}
function prettyType(t) {
  if (!t) return '';
  return t.replace(/^session-/, '').replace(/^tournament-/, '')
          .replace(/nwchallenge/, 'NW Challenge').replace(/worldqualifier/, 'World Qualifier')
          .replace(/triannuals/, 'Tri-Annuals').replace(/-/g, ' ');
}

function renderChips() {
  document.getElementById('evTypeChips').innerHTML = TYPE_GROUPS.map(function (g) {
    return '<button class="ev-chip" type="button" data-kind="type" data-key="' + g.key +
           '" aria-pressed="' + (state.types[g.key] ? 'true' : 'false') + '">' + esc(g.label) + '</button>';
  }).join('');
  document.getElementById('evAreaChips').innerHTML = AREAS.map(function (a) {
    return '<button class="ev-chip" type="button" data-kind="area" data-key="' + a.key +
           '" aria-pressed="' + (state.areas[a.key] ? 'true' : 'false') + '">' + esc(a.label) + '</button>';
  }).join('');
}

function visible() {
  return state.groups.filter(function (g) {
    return state.types[groupOf(g.type)] !== false && state.areas[g.area] !== false;
  });
}

function renderList() {
  var host = document.getElementById('evList');
  if (state.error) { host.innerHTML = '<div class="ev-err">Could not load events: ' + esc(state.error) + '</div>'; return; }
  var rows = visible();
  if (!rows.length) { host.innerHTML = '<div class="ev-empty">Nothing matches those filters.</div>'; return; }

  var html = '', lastMonth = '';
  rows.forEach(function (g) {
    var mk = monthKey(g.start);
    if (mk !== lastMonth) { html += '<div class="ev-month">' + esc(mk) + '</div>'; lastMonth = mk; }
    var isHol = g.type === 'holiday';
    var allDay = !!(g.events[0] && g.events[0].allDay);
    html += '<div class="ev-card' + (isHol ? ' is-holiday' : '') + '">';
    html += '<div class="ev-title">' + esc(g.title) +
            (g.type ? '<span class="ev-badge">' + esc(prettyType(g.type)) + '</span>' : '') + '</div>';
    html += '<div class="ev-meta">' + esc(fmtRange(g.start, g.end, allDay)) +
            (g.location ? ' &middot; ' + esc(g.location) : '') + '</div>';

    if (g.multi) {
      html += '<div class="ev-kids">' + g.events.map(function (e) {
        return '<div class="ev-kid"><span class="ev-kid-name">' + esc(e.name) + '</span>' +
               '<span class="ev-kid-when">' + esc(fmtRange(e.start, e.end, e.allDay)) + '</span></div>';
      }).join('') + '</div>';
    }
    if (g.description && g.description.trim()) {
      var isOpen = !!state.open[g.parentId];
      html += '<button class="ev-more" type="button" data-more="' + esc(g.parentId) + '">' +
              (isOpen ? 'Hide details' : 'Details') + '</button>';
      if (isOpen) html += '<div class="ev-details">' + esc(g.description.trim()) + '</div>';
    }
    html += '</div>';
  });
  host.innerHTML = html;
}

function render() { renderChips(); renderList(); }

/* One delegated listener — survives every re-render. */
document.addEventListener('click', function (ev) {
  var chip = ev.target.closest('.ev-chip');
  if (chip) {
    var k = chip.getAttribute('data-key');
    if (chip.getAttribute('data-kind') === 'type') state.types[k] = !state.types[k];
    else state.areas[k] = !state.areas[k];
    render();
    return;
  }
  var more = ev.target.closest('[data-more]');
  if (more) {
    var id = more.getAttribute('data-more');
    state.open[id] = !state.open[id];
    renderList();   /* only the list re-renders, so scroll position is kept */
  }
});

function load() {
  return fetch(SNAPSHOT_URL, { cache: 'no-store' })
    .then(function (res) { return res.json().then(function (j) { return { res: res, j: j }; }); })
    .then(function (r) {
      if (!r.res.ok || r.j.ok === false) throw new Error(r.j.error || ('HTTP ' + r.res.status));
      state.groups = r.j.groups || [];
      state.ranAt = r.j.ranAt; state.error = null;
      var n = state.groups.reduce(function (t, g) { return t + g.events.length; }, 0);
      document.getElementById('evSub').textContent =
        n + ' upcoming event' + (n === 1 ? '' : 's') + ' · updated ' +
        new Date(r.j.ranAt).toLocaleString(undefined,
          { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
    })
    .catch(function (e) {
      state.error = e.message;
      document.getElementById('evSub').textContent = 'Could not reach the calendar.';
    })
    .then(render);
}

load();
setInterval(load, REFRESH_MS);
document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
</script>
</body>
</html>
